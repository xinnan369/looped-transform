name: CPU tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            os: ubuntu-22.04
          - python: '3.13'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reuse preinstalled runner Python
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          toolcache="$RUNNER_TOOL_CACHE/Python"
          version="$(find "$toolcache" -mindepth 1 -maxdepth 1 -type d -name "$PYTHON_VERSION.*" -printf '%f\n' | sort -V | tail -n 1)"
          python_bin=/usr/bin/python3
          if [[ -n "$version" && -f "$toolcache/$version/x64.complete" ]]; then
            python_bin="$toolcache/$version/x64/bin/python"
          fi
          test "$("$python_bin" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "$PYTHON_VERSION"
          "$python_bin" -m venv --without-pip "$RUNNER_TEMP/loopcrowd-venv"
          echo "$RUNNER_TEMP/loopcrowd-venv/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
      - name: Stage pinned wheels from the domestic mirror
        run: python scripts/stage_ci_wheels.py "$RUNNER_TEMP/loopcrowd-wheels"
      - name: Install staged wheels offline
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_CONFIG_FILE: /dev/null
        run: |
          PYTHONPATH="$RUNNER_TEMP/loopcrowd-wheels/pip-25.2-py3-none-any.whl" +            python -m pip install --no-index --no-deps "$RUNNER_TEMP"/loopcrowd-wheels/*.whl
          python -m pip check
      - run: pytest -q
      - run: python scripts/audit_dataset.py --help
      - run: python scripts/train.py --help
      - run: python scripts/evaluate.py --help
      - run: python scripts/profile.py --help
